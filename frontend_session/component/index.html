<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
const send = (type, values = {}) => window.parent.postMessage({isStreamlitMessage: true, type, ...values}, '*');
let started = false;
window.addEventListener('message', async (event) => {
  if (event.source !== window.parent || event.data.type !== 'streamlit:render' || started) return;
  started = true;
  const {endpoint, ticket} = event.data.args;
  try {
    const response = await fetch(endpoint, {
      method: 'POST', credentials: 'include', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ticket: ticket || null})
    });
    send('streamlit:setComponentValue', {value: {ok: response.ok}, dataType: 'json'});
  } catch (_) {
    send('streamlit:setComponentValue', {value: {ok: false}, dataType: 'json'});
  }
});
send('streamlit:componentReady', {apiVersion: 1});
send('streamlit:setFrameHeight', {height: 0});
</script></body></html>
